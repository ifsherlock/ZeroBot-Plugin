# mediaparser 预构建 DockerHub 镜像部署示例
#
# 这个 compose 文件用于启动 GitHub Actions 发布的轻量运行时镜像。
# 镜像：jaysherlock/zerobot-plugin:latest
#
# 启动：
#   docker compose -f docs/docker-compose.mediaparser.yml up -d
# 更新：
#   docker compose -f docs/docker-compose.mediaparser.yml pull
#   docker compose -f docs/docker-compose.mediaparser.yml up -d

services:
  mediaparser:
    image: jaysherlock/zerobot-plugin:latest
    container_name: mediaparser
    restart: unless-stopped
    # host 网络会直接使用宿主机端口，不需要再写 ports 映射。
    # 镜像内监听：
    #   - 3000：WebUI
    #   - 3088：内置 nginx 静态服务，用于 QQBot 图片
    # nginx 会把 /app/data/mediaparser/cache 暴露为 /cache/。
    network_mode: host
    environment:
      # 容器时区，影响日志时间和定时任务时间。
      TZ: Asia/Shanghai
      # WebUI 监听地址。host 网络下会直接监听宿主机 3000 端口。
      WEBUI_ADDR: 0.0.0.0:3000
      WEBUI_USER: admin
      # WEBUI_PASSWORD 环境变量=请使用强密码！！！
      WEBUI_PASSWORD: "请使用强密码！！！"
      # OneBot 反向 WebSocket 地址。
      # 只使用内置 WebUI/解析能力时留空；llbot 和本容器在同一台 Linux 主机时填 ws://127.0.0.1:3001。
      ONEBOT_WS_URL: ""
      # OneBot WebSocket 鉴权 token；没有配置鉴权时留空。
      ONEBOT_WS_TOKEN: ""
      # OneBot/llbot 所在主机能看到的数据目录。
      # 当 llbot 不在容器内、且不能通过 127.0.0.1:3088 读取内置 nginx 时，用它把容器内 /app/data 映射回宿主机路径。
      # 如果 compose 文件和 data 目录在同一目录，通常填 ${PWD}/data；不需要本地路径映射时留空。
      ONEBOT_DATA_DIR: "${PWD}/data"
      # 机器人默认昵称，用于部分回复文本和识别。
      BOT_NICKNAME: ZeroBot
      # 命令前缀，例如 /解析、/服务列表。
      COMMAND_PREFIX: /
      # 超级用户 QQ 号，多个账号用空格分隔，例如 "12345 67890"。
      SUPER_USERS: ""
      # 小黑盒帖子使用 Android 版 Chromium 截图，保留游戏卡、音乐和原帖排版。
      # 设为 0 可回退到轻量原生卡片。
      XIAOHEIHE_MOBILE_SCREENSHOT: "1"
      # 额外传给 zbp 的启动参数，例如 "-d" 开启 debug；不需要时留空。
      ZBP_ARGS: ""
    volumes:
      # 持久化数据目录。配置、Cookie、缓存图片和 WebUI 数据都会写入 /app/data。
      - ./data:/app/data
