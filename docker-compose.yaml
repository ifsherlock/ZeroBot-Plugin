services:
  zerobot-plugin:
    build:
      context: .
      dockerfile: Dockerfile
    image: zerobot-plugin:local
    container_name: zerobot-plugin
    restart: unless-stopped
    # Host networking shares host ports directly, so no ports: mapping is needed.
    # The image listens on:
    #   - 3000: WebUI
    #   - 3088: bundled nginx static server for QQBot images
    # nginx exposes /app/data/mediaparser/cache as /cache/.
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      WEBUI_ADDR: 0.0.0.0:3000
      ONEBOT_WS_URL: ws://127.0.0.1:3001
      ONEBOT_WS_TOKEN: ""
      BOT_NICKNAME: ZeroBot
      COMMAND_PREFIX: /
      SUPER_USERS: ""
      ZBP_ARGS: ""
    volumes:
      - ./data:/app/data
