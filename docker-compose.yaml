services:
  zerobot-plugin:
    build:
      context: .
      dockerfile: Dockerfile
    image: zerobot-plugin:local
    container_name: zerobot-plugin
    restart: unless-stopped
    # host 网络会直接使用宿主机端口，不需要再写 ports 映射。
    # 镜像内监听：
    #   - 3000：WebUI
    #   - 3088：内置 nginx 静态服务，用于 QQBot 图片
    # nginx 会把 /app/data/mediaparser/cache 暴露为 /cache/。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      WEBUI_ADDR: 0.0.0.0:3000
      WEBUI_USER: admin
      # WEBUI_PASSWORD 环境变量=请使用强密码！！！
      WEBUI_PASSWORD: "请使用强密码！！！"
      ONEBOT_WS_URL: ws://127.0.0.1:3001
      ONEBOT_WS_TOKEN: ""
      # OneBot/llbot 所在主机能看到的数据目录；用于把容器内 /app/data 的 file:// 图片路径映射回宿主机路径。
      ONEBOT_DATA_DIR: "${PWD}/data"
      BOT_NICKNAME: ZeroBot
      COMMAND_PREFIX: /
      SUPER_USERS: ""
      ZBP_ARGS: ""
    volumes:
      - ./data:/app/data
