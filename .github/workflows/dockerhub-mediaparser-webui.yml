name: DockerHub Test Image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mediaparser-playground-webui-dockerhub
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - "plugin/mediaparser/**"
      - ".github/workflows/dockerhub-mediaparser-webui.yml"

permissions:
  contents: read

concurrency:
  group: dockerhub-mediaparser-webui-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: jaysherlock/zerobot-plugin
  GO_VERSION: "1.26.1"

jobs:
  build-binary:
    name: Build Go binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Generate embed reference files
        run: go generate main.go

      - name: Build binary for Docker target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p .tmp/ci
          go build -trimpath -ldflags="-s -w" -o ".tmp/ci/zbp-${GOOS}-${GOARCH}" .
          test -s ".tmp/ci/zbp-${GOOS}-${GOARCH}"

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=test

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
